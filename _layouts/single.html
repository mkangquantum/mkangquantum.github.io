---
layout: default
---
<article class="page-content">
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    {% if page.date %}
      <p class="page-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
    {% endif %}
  </header>
  {{ content }}
</article>
